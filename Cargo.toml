[package]
name = "swarm-space"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = ["2d", "ui"] }
swarm-core = { path = "crates/swarm-core" }
swarm-runner = { path = "crates/swarm-runner" }

[workspace]
members = [".", "crates/swarm-core", "crates/swarm-runner"]

# ICU4X 2.2 logs a false warning for CJK while its line-breaker deliberately
# falls back to Unicode's normal CJK rules. Keep the one-line upstream hotfix
# local until the dependency publishes it.
[patch.crates-io]
icu_segmenter = { path = "vendor/icu_segmenter" }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
