[package]
name = "swarm-space"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
swarm-core = { path = "crates/swarm-core" }
swarm-runner = { path = "crates/swarm-runner" }

[workspace]
members = [".", "crates/swarm-core", "crates/swarm-runner"]

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
