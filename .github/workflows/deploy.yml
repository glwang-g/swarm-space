name: Deploy swarm.freexlib.com

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swarm-space-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, swarm-space]
    timeout-minutes: 30
    env:
      CARGO_HOME: /home/ubuntu/.cargo
      CARGO_TARGET_DIR: /home/ubuntu/.cache/swarm-space/target

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Configure local toolchain
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          /home/ubuntu/.cargo/bin/rustup target add wasm32-unknown-unknown
          /home/ubuntu/.cargo/bin/wasm-bindgen --version
          /usr/local/bin/trunk --version

      - name: Test simulation
        run: cargo test -p swarm-core -p swarm-runner

      - name: Build browser release
        env:
          NO_COLOR: "true"
        run: trunk build --release

      - name: Activate local release
        run: |
          sudo install -d -m 0755 /var/www/swarm-space
          sudo rsync -a --delete dist/ /var/www/swarm-space/
          sudo chown -R www-data:www-data /var/www/swarm-space
          sudo install -m 0644 deploy/nginx/swarm-space-static.conf /etc/nginx/snippets/swarm-space-static.conf
          sudo nginx -t
          sudo systemctl reload nginx

      # Freexlib portal now deploys from the sibling `freexlib-portal` repository.

      - name: Verify production
        run: curl -fsS https://swarm.freexlib.com/ | grep -q '群智空间'
